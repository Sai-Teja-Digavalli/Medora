<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medora | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00b4d8;
            --secondary-color: #0077b6;
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-gradient); margin: 0; min-height: 100vh; }
        .navbar { background: linear-gradient(to right, var(--secondary-color), var(--primary-color)); padding: 1rem 2rem; color: white; display: flex; justify-content: space-between; align-items: center;}
        .navbar .logo { font-size: 1.5rem; font-weight: 600; }
        .navbar-links a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; }
        .container { max-width: 500px; margin: 60px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: var(--card-shadow); border-top: 5px solid var(--primary-color); }
        h2 { text-align: center; color: var(--secondary-color); margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: 'Poppins', sans-serif;}
        button { padding: 15px; background: var(--secondary-color); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--primary-color); }
        .flash { padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;}
        .flash.success { background: #d4edda; color: #155724; }
        .flash.danger { background: #f8d7da; color: #721c24; }
        .flash.warning { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Medora</div>
        <div class="navbar-links"><a href="/">Home</a><a href="/register">Register</a></div>
    </nav>
    <div class="container">
        <h2>Login</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}


        <form method="POST" action="/login">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p style="text-align: center; margin-top:20px;">Don't have an account? <a href="/register">Register</a></p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', function() {
                    const submitBtns = form.querySelectorAll('button[type="submit"], input[type="submit"]');
                    submitBtns.forEach(btn => {
                        btn.disabled = true;
                        btn.innerHTML = 'Processing...';
                        btn.style.opacity = '0.7';
                        btn.style.cursor = 'not-allowed';
                    });
                });
            });
        });
    </script>
</body>
</html>
